<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Seda'nın web geliştirme yolculuğu ve kişisel tanıtım sayfası.">
    <meta name="theme-color" content="#111126">
    <title>Seda | Web Geliştirme Yolculuğum</title>

    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: #111126;
            color: #f6f3ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            background:
                radial-gradient(ellipse at 15% 15%, rgb(131 87 255 / 18%), transparent 36rem),
                radial-gradient(ellipse at 90% 85%, rgb(255 108 171 / 12%), transparent 32rem),
                #111126;
        }

        a {
            color: inherit;
        }

        .sayfa {
            display: flex;
            min-height: 100vh;
            flex-direction: column;
            padding: 0 clamp(1.25rem, 6vw, 6rem);
        }

        .ust-alan,
        .alt-alan {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .ust-alan {
            min-height: 88px;
            border-bottom: 1px solid rgb(255 255 255 / 9%);
        }

        .imza {
            font-size: 1rem;
            font-weight: 750;
            letter-spacing: -0.04em;
        }

        .imza span {
            color: #b7a0ff;
        }

        .durum {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            color: #c4bfd6;
            font-size: 0.85rem;
        }

        .durum::before {
            width: 0.55rem;
            height: 0.55rem;
            border-radius: 50%;
            background: #8be0b0;
            box-shadow: 0 0 14px rgb(139 224 176 / 70%);
            content: "";
        }

        main {
            display: grid;
            width: min(100%, 1100px);
            flex: 1;
            align-items: center;
            align-self: center;
            grid-template-columns: minmax(0, 1.2fr) minmax(250px, 0.8fr);
            gap: clamp(2.5rem, 8vw, 7rem);
            padding: clamp(4rem, 10vh, 8rem) 0;
        }

        .etiket {
            margin: 0 0 1.5rem;
            color: #c4b3ff;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            max-width: 700px;
            margin: 0;
            font-size: clamp(3.3rem, 8vw, 6.8rem);
            font-weight: 750;
            letter-spacing: -0.075em;
            line-height: 0.98;
        }

        h1 span {
            color: #b7a0ff;
        }

        .aciklama {
            max-width: 500px;
            margin: 1.8rem 0 0;
            color: #c4bfd6;
            font-size: clamp(1.05rem, 2vw, 1.2rem);
            line-height: 1.8;
        }

        .kart {
            position: relative;
            display: grid;
            min-height: 300px;
            place-items: center;
            overflow: hidden;
            border: 1px solid rgb(255 255 255 / 13%);
            border-radius: 2rem;
            background: linear-gradient(145deg, rgb(255 255 255 / 10%), rgb(255 255 255 / 3%));
            box-shadow: 0 28px 80px rgb(0 0 0 / 25%);
        }

        .kart::before,
        .kart::after {
            position: absolute;
            width: 190px;
            height: 190px;
            border: 1px solid rgb(255 255 255 / 15%);
            border-radius: 50%;
            content: "";
        }

        .kart::after {
            width: 255px;
            height: 255px;
        }

        .isaret {
            z-index: 1;
            color: #e5dfff;
            font-size: 6rem;
            font-weight: 300;
            letter-spacing: -0.12em;
        }

        .kart-notu {
            position: absolute;
            right: 1.5rem;
            bottom: 1.4rem;
            left: 1.5rem;
            color: #c4bfd6;
            font-size: 0.85rem;
            text-align: center;
        }

        .alt-alan {
            min-height: 76px;
            border-top: 1px solid rgb(255 255 255 / 9%);
            color: #a9a4bb;
            font-size: 0.8rem;
        }

        @media (max-width: 700px) {
            .ust-alan {
                min-height: 72px;
            }

            main {
                grid-template-columns: 1fr;
                gap: 2.5rem;
                padding: 5rem 0;
            }

            .kart {
                min-height: 230px;
            }
        }

        @media (prefers-reduced-motion: no-preference) {
            main {
                animation: belir 700ms ease-out both;
            }

            @keyframes belir {
                from {
                    opacity: 0;
                    transform: translateY(12px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        }
    </style>
</head>

<body>
    <div class="sayfa">
        <header class="ust-alan">
            <a class="imza" href="./" aria-label="Seda ana sayfa">seda<span>.</span></a>
            <span class="durum">Öğrenmeye devam ediyorum</span>
        </header>

        <main>
            <section aria-labelledby="baslik">
                <p class="etiket">Merhaba, ben Seda</p>
                <h1>Fikirleri<br><span>öğrenerek</span><br>gerçeğe.</h1>
                <p class="aciklama">
                    Web geliştirme dünyasını keşfediyorum. Her yeni satır kodla
                    öğreniyor, üretiyor ve kendime yeni şeyler katıyorum.
                </p>
            </section>

            <aside class="kart" aria-label="Kod yazmayı ve yeni şeyler öğrenmeyi seviyorum">
                <span class="isaret" aria-hidden="true">&lt;/&gt;</span>
                <span class="kart-notu">Merakla başla. Deneyerek öğren.</span>
            </aside>
        </main>

        <footer class="alt-alan">
            <span>© 2026 Seda</span>
            <span>Sevgiyle ve biraz kodla yapıldı.</span>
        </footer>
    </div>
</body>

</html>
